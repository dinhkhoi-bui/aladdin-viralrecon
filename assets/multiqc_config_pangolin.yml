intro_text: >
  This report has been generated by the <a href="https://github.com/Zymo-Research/aladdin-viralrecon" target="_blank">Zymo-Research/aladdin-viralrecon</a>
  analysis pipeline. For information about how to interpret these results, please see the
  <a href="https://zymo-research.github.io/pipeline-resources/report_docs/viralrecon_documentation.html" target="_blank">report documentation</a>.
report_comment: "If you have any question regarding this report, please contact us via the Aladdin platform."

data_format: "yaml"

max_table_rows: 10000
skip_generalstats: true

run_modules:
  - fastqc
  - fastp
  - kraken
  - pangolin

module_order:
  - fastqc:
      name: "PREPROCESS: FastQC (raw reads)"
      info: "This section of the report shows FastQC results for the raw reads before adapter trimming."
      path_filters:
        - "./fastqc/*.zip"
  - fastp:
      name: "PREPROCESS: fastp (adapter trimming)"
      info: "This section of the report shows fastp results for reads after adapter and quality trimming."
  - kraken:
      name: "PREPROCESS: Kraken 2"
      info: "This section of the report shows Kraken 2 classification results for reads after adapter trimming with fastp."
      path_filters:
        - "./kraken2/*kraken2.report.txt"
      taxonomic_level: "species"
      include_bracken: false
      display_tree: true
      top_n: 10
  - pangolin:
      name: "VARIANTS: Pangolin"
      info: "This section of the report shows Pangolin lineage analysis results for the called variants."
      path_filters:
        - "./variants/*.pangolin.csv"